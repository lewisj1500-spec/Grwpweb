    z-index: 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(72,112,221,0.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(194,160,106,0.25), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(212,237,227,0.6), transparent 55%),
      linear-gradient(135deg, rgba(250,250,247,0.82) 0%, rgba(245,241,232,0.88) 100%);
    z-index: 1;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 2;
    max-width: 560px;
    width: 100%;
    animation: up 0.9s cubic-bezier(0.22,1,0.36,1) both;
  }
  .eyebrow {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 22px;
  }
  h1 {
    font-weight: 900;
    font-size: clamp(56px, 14vw, 96px);
    letter-spacing: -4px;
    line-height: 1;
    color: #0f172a;
    margin-bottom: 14px;
  }
  .tagline {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 4vw, 26px);
    color: #3d5c50;
    margin-bottom: 22px;
  }
  .desc {
    font-size: 15px;
    line-height: 1.7;
    color: #334155;
    margin-bottom: 44px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }
  .form {
    display: flex;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto 16px;
  }
  .form input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 100px;
    border: 1.5px solid rgba(232,230,225,0.8);
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(16px);
    color: #0f172a;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form input::placeholder { color: #94a3b8; }
  .form input:focus { border-color: #5a8071; }
  .form button {
    padding: 14px 24px;
    border-radius: 100px;
    border: none;
    background: #5a8071;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s;
  }
  .form button:hover { background: #3d5c50; transform: translateY(-1px); }
  .note {
    font-size: 11px;
    color: #64748b;
    letter-spacing: 0.06em;
  }
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 24px;
    z-index: 3;
  }
  .footer a {
    font-size: 11px;
    color: #64748b;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer a:hover { color: #0f172a; }
  @keyframes up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 480px) {
    .form { flex-direction: column; }
    .form button { width: 100%; }
  }
</style>
</head>
